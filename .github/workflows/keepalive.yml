name: Keep Render API Awake

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier 15-minute sleep
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Tcha-Tcha Render API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://tchatcha-api-1.onrender.com/)
          echo "Render API responded with HTTP $code"
